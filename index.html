<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherlock — 用户名跨平台查询</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface-2:#242836;
    --border:#2e3345;--text:#e4e6ef;--text-2:#9ca3af;
    --accent:#6366f1;--accent-2:#818cf8;
    --green:#34d399;--gray:#6b7280;--yellow:#fbbf24;--red:#f87171;--purple:#a78bfa;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

  .container{max-width:720px;margin:0 auto;padding:3rem 1.5rem 4rem}

  header{text-align:center;margin-bottom:2.5rem}
  header h1{font-size:1.8rem;font-weight:700;margin-bottom:.5rem;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--text-2);font-size:.9rem}

  .search-box{display:flex;gap:.75rem;margin-bottom:1.25rem}
  .search-box input{flex:1;padding:.8rem 1.1rem;font-size:1rem;
    background:var(--surface);border:1px solid var(--border);border-radius:.6rem;
    color:var(--text);outline:none;transition:border-color .2s}
  .search-box input:focus{border-color:var(--accent)}
  .search-box input::placeholder{color:var(--text-2)}
  .search-box button{padding:.8rem 1.5rem;font-size:1rem;font-weight:500;
    background:var(--accent);color:#fff;border:none;border-radius:.6rem;cursor:pointer;
    transition:background .2s,transform .1s;white-space:nowrap}
  .search-box button:hover{background:var(--accent-2)}
  .search-box button:active{transform:scale(.97)}
  .search-box button:disabled{opacity:.5;cursor:not-allowed}

  .options{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.5rem;font-size:.85rem}
  .options label{display:flex;align-items:center;gap:.4rem;color:var(--text-2);
    cursor:pointer;user-select:none}
  .options input[type="checkbox"]{accent-color:var(--accent);cursor:pointer}

  .status{padding:1rem;text-align:center;color:var(--text-2);font-size:.9rem;
    background:var(--surface);border-radius:.6rem;margin-bottom:1rem}
  .status.loading::before{content:"";display:inline-block;width:1rem;height:1rem;
    border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;margin-right:.5rem;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status.error{color:var(--red)}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:.75rem;margin-bottom:1.5rem}
  .summary-card{background:var(--surface);border:1px solid var(--border);
    border-radius:.6rem;padding:1rem;text-align:center}
  .summary-card .num{font-size:1.6rem;font-weight:700}
  .summary-card .label{font-size:.75rem;color:var(--text-2);margin-top:.2rem}

  .results{display:flex;flex-direction:column;gap:1.25rem}
  .group h2{font-size:.85rem;color:var(--text-2);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
  .group h2 .count{background:var(--surface-2);padding:.1rem .5rem;border-radius:1rem;font-size:.75rem}
  .group h2 .dot{width:.5rem;height:.5rem;border-radius:50%}
  .dot-claimed{background:var(--green)}.dot-available{background:var(--gray)}
  .dot-waf{background:var(--purple)}.dot-unknown{background:var(--yellow)}
  .dot-illegal{background:var(--red)}

  .site-list{display:grid;gap:.4rem}
  .site-item{display:flex;align-items:center;justify-content:space-between;
    padding:.65rem .9rem;background:var(--surface);border:1px solid var(--border);
    border-radius:.5rem;transition:border-color .2s}
  .site-item:hover{border-color:var(--accent)}
  .site-item a{color:var(--text);text-decoration:none;font-size:.9rem;font-weight:500}
  .site-item a:hover{color:var(--accent-2)}
  .site-item .meta{display:flex;align-items:center;gap:.75rem;font-size:.75rem;color:var(--text-2)}
  .badge{padding:.15rem .5rem;border-radius:.3rem;font-size:.7rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.03em}
  .badge-claimed{background:rgba(52,211,153,.15);color:var(--green)}
  .badge-available{background:rgba(107,114,128,.15);color:var(--gray)}
  .badge-waf{background:rgba(167,139,250,.15);color:var(--purple)}
  .badge-unknown{background:rgba(251,191,36,.15);color:var(--yellow)}
  .badge-illegal{background:rgba(248,113,113,.15);color:var(--red)}

  .hidden{display:none}
  footer{text-align:center;margin-top:3rem;color:var(--text-2);font-size:.8rem}
  footer a{color:var(--accent-2);text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Sherlock</h1>
    <p>输入用户名，跨 481 个社交平台查找账号</p>
  </header>

  <div class="search-box">
    <input type="text" id="username" placeholder="输入用户名，如 torvalds"
      autocomplete="off" spellcheck="false">
    <button id="search-btn">查询</button>
  </div>

  <div class="options">
    <label><input type="checkbox" id="exclude-nsfw">排除 NSFW</label>
    <label><input type="checkbox" id="hide-available" checked>隐藏未注册</label>
    <label>超时 <input type="number" id="timeout" value="20" min="1" max="60"
      style="width:3.5rem;background:var(--surface);border:1px solid var(--border);
      border-radius:.3rem;color:var(--text);padding:.2rem .4rem"></label>
  </div>

  <div id="status" class="status hidden"></div>
  <div id="summary" class="summary hidden"></div>
  <div id="results" class="results"></div>

  <footer>
    基于 <a href="https://github.com/sherlock-project/sherlock" target="_blank">Sherlock</a>
    · 部署于 EdgeOne Makers · <a href="https://github.com/Theadvocate-bit/sherlock_edgeone" target="_blank">GitHub</a>
  </footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const usernameInput=$("username"), searchBtn=$("search-btn"),
    statusEl=$("status"), summaryEl=$("summary"), resultsEl=$("results");
  let lastData=null;

  const STATUS_META={
    Claimed:{label:"已注册",cls:"claimed",dot:"dot-claimed"},
    Available:{label:"未注册",cls:"available",dot:"dot-available"},
    WAF:{label:"WAF拦截",cls:"waf",dot:"dot-waf"},
    Unknown:{label:"未知",cls:"unknown",dot:"dot-unknown"},
    Illegal:{label:"非法用户名",cls:"illegal",dot:"dot-illegal"}
  };

  function setStatus(msg,type){
    if(!msg){statusEl.classList.add("hidden");return}
    statusEl.textContent=msg;
    statusEl.className="status"+(type==="loading"?" loading":type==="error"?" error":"");
  }

  function render(data,hideAvailable){
    summaryEl.classList.remove("hidden");
    resultsEl.innerHTML="";

    const byStatus={};
    for(const [site,info] of Object.entries(data.results)){
      (byStatus[info.status]=byStatus[info.status]||[]).push({site,...info});
    }

    // summary cards
    const cards=[
      {num:data.found,label:"已注册",color:"var(--green)"},
      {num:data.total_sites,label:"扫描站点",color:"var(--text)"},
      {num:data.elapsed_seconds+"s",label:"耗时",color:"var(--text-2)"}
    ];
    summaryEl.innerHTML=cards.map(c=>
      `<div class="summary-card"><div class="num" style="color:${c.color}">${c.num}</div>
       <div class="label">${c.label}</div></div>`).join("");

    // groups in priority order
    const order=["Claimed","WAF","Unknown","Available","Illegal"];
    for(const status of order){
      const items=byStatus[status];
      if(!items||!items.length)continue;
      if(hideAvailable&&status==="Available")continue;

      const meta=STATUS_META[status];
      const group=document.createElement("div");
      group.className="group";
      group.innerHTML=`<h2><span class="dot ${meta.dot}"></span>${meta.label}
        <span class="count">${items.length}</span></h2>`;

      const list=document.createElement("div");
      list.className="site-list";
      items.sort((a,b)=>a.site.localeCompare(b.site));
      for(const item of items){
        const div=document.createElement("div");
        div.className="site-item";
        const linkStart=status==="Claimed"&&item.url
          ?`<a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.site}</a>`
          :`<span style="color:var(--text)">${item.site}</span>`;
        const httpBadge=item.http_status&&item.http_status!=="?"
          ?`<span>HTTP ${item.http_status}</span>`:"";
        div.innerHTML=`${linkStart}<div class="meta">${httpBadge}
          <span class="badge badge-${meta.cls}">${meta.label}</span></div>`;
        list.appendChild(div);
      }
      group.appendChild(list);
      resultsEl.appendChild(group);
    }
  }

  async function search(){
    const username=usernameInput.value.trim();
    if(!username){setStatus("请输入用户名","error");return}

    searchBtn.disabled=true;
    setStatus(`正在扫描 ${username} …`,"loading");
    summaryEl.classList.add("hidden");
    resultsEl.innerHTML="";

    const params=new URLSearchParams({username});
    const timeout=$("timeout").value;
    if(timeout&&timeout!=="20")params.set("timeout",timeout);
    if($("exclude-nsfw").checked)params.set("exclude_nsfw","true");

    try{
      const resp=await fetch(`/api/sherlock?${params}`);
      const data=await resp.json();
      if(!resp.ok)throw new Error(data.error||`HTTP ${resp.status}`);
      setStatus("");
      lastData=data;
      render(data,$("hide-available").checked);
    }catch(err){
      setStatus("查询失败："+err.message,"error");
    }finally{
      searchBtn.disabled=false;
    }
  }

  searchBtn.addEventListener("click",search);
  usernameInput.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
  $("hide-available").addEventListener("change",function(){
    if(lastData)render(lastData,this.checked);
  });
})();
</script>
</body>
</html>
